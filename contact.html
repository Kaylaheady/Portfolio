<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Kayla Heady</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="nav">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">Kayla Heady</a>
            <div class="nav-links">
                <a href="work.html">Work</a>
                <a href="about.html">About</a>
                <a href="contact.html" class="active">Contact</a>
            </div>
        </div>
    </nav>

    <main>
        <section class="contact-page">
            <div class="container">
                <h1 class="page-title">Get in Touch</h1>
                <p class="contact-intro">I'm always open to discussing new projects, design opportunities, or just having a conversation about UX. Feel free to reach out!</p>

                <form class="contact-form" id="contact-form" action="mailto:kayla.heady@example.com" method="post" enctype="text/plain">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="6" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Send Message</button>
                </form>

                <div class="contact-alternative">
                    <p>Or reach me directly:</p>
                    <div class="contact-buttons">
                        <a href="mailto:kayla.heady@example.com" class="btn btn-secondary">Email</a>
                        <a href="https://linkedin.com/in/kaylaheady" class="btn btn-secondary" target="_blank" rel="noopener noreferrer">LinkedIn</a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <p class="footer-email">kayla.heady@example.com</p>
                <a href="https://linkedin.com/in/kaylaheady" class="footer-link" target="_blank" rel="noopener noreferrer">LinkedIn</a>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
